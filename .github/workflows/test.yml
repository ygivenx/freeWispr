name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests with coverage
        working-directory: FreeWispr
        run: swift test --enable-code-coverage --filter FreeWisprTests
